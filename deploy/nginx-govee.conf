# nginx site for the govee-cli web console ("filament").
#
# Browser flow:  https://100.121.176.1:6056  ->  nginx (TLS terminate)
#                                           ->  127.0.0.1:6056  (Next.js)
#                Next.js rewrites /api/v1/*  ->  127.0.0.1:6057  (FastAPI sidecar)
#
# Follows the house convention in sites-enabled/tailscale-proxy.conf: bind the
# Tailscale IP only, reuse the shared self-signed cert. Note that nginx listens
# on 100.121.176.1:6056 while Next.js listens on 127.0.0.1:6056 — different
# addresses, so there is no port clash. Binding 0.0.0.0:6056 here WOULD clash
# (and would expose the console on the LAN), so keep the IP explicit.
#
# Install with deploy/install-nginx-govee.sh (batches the sudo work).

server {
    listen 100.121.176.1:6056 ssl;
    server_name pop-os pop-os.tail45638d.ts.net;

    ssl_certificate     /etc/nginx/ssl/tailscale-proxy.crt;
    ssl_certificate_key /etc/nginx/ssl/tailscale-proxy.key;

    # Tailnet is the auth boundary — the console itself has no login.
    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:6056;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        # Effect playback and state polling hold connections open.
        proxy_read_timeout 300s;
    }
}
