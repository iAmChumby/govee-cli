# nginx site for the govee-cli web console.
# Install to /etc/nginx/sites-available/govee.conf, symlink into sites-enabled,
# then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Browser flow:  https://pop-os:6056  ->  127.0.0.1:6056 (Next.js)
# Next.js rewrites /api/v1/*    ->  127.0.0.1:6057 (FastAPI sidecar)
#
# The Next.js rewrite already proxies the API, so nginx only ever sees one
# upstream. The explicit /api/v1 block below is optional belt-and-braces that
# lets you hit the sidecar directly through the same origin.

server {
    listen 6056 ssl;
    listen [::]:6056 ssl;
    server_name pop-os;

    # Reuse whatever cert your tailnet already trusts (Tailscale's built-in
    # certs live under /var/lib/tailscale/certs/ when enabled).
    ssl_certificate     /var/lib/tailscale/certs/pop-os.crt;
    ssl_certificate_key /var/lib/tailscale/certs/pop-os.key;

    # Tailnet is the auth boundary; keep the port off your LAN interface by
    # binding nginx per your firewall policy.

    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:6056;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
