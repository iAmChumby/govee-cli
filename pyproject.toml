[project]
name = "govee-cli"
version = "0.1.0"
description = "A CLI tool to control Govee smart lights over Bluetooth Low Energy (BLE)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Luke Edwards", email = "edwards.lukec@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21.0",
    "click>=8.1.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    # http.py / http_v2.py talk to the Govee cloud with requests. It was an
    # undeclared transitive dependency until 2026-08-25 — present in every dev
    # venv, absent on a clean CI runner, which is why `import govee_cli` failed
    # there for months while the CLI worked fine locally.
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "types-requests>=2.31.0",
    # starlette's TestClient (tests/test_webui_api.py) needs this.
    "httpx2>=2.0.0",
]
webui = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
govee-cli = "govee_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["govee_cli*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["call-arg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"govee_cli/cli.py" = ["E402"]
